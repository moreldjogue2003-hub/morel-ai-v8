<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOREL AI V8</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#0f0f1a;color:#fff}header{background:linear-gradient(135deg,#8b5cf6,#f97316);padding:14px;text-align:center}.b{max-width:500px;margin:auto;padding:12px}.c{background:#1e1e32;border-radius:14px;padding:12px;margin-bottom:10px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #444;background:#121224;color:#fff;margin-top:5px}textarea{min-height:70px}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;margin-top:8px;color:#fff;cursor:pointer}.ph{height:180px;background:#0a0a15;border:2px dashed #666;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}video{width:100%;display:none;margin-top:8px}.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body>
<header><h1>🗣️ MOREL AI V8</h1><p>Photo qui parle - Journal TV</p></header><div class="b">
<div class="c" id="cb" style="display:none;background:#111;color:#facc15;text-align:center;border:1px solid #facc15;font-weight:800">👑 MODE CRÉATEUR ACTIVÉ - ILLIMITÉ</div>
<div class="c" id="ct" style="background:#fef3c7;color:#111;text-align:center;font-weight:700;font-size:13px">Il te reste <b id="lc">2</b> vidéos gratuites</div>
<div class="c"><div class="r"><button type="button" class="btn" data-action="photo-mode" style="background:#8b5cf6">📸 Ma Photo</button><button type="button" class="btn" data-action="text-mode" style="background:#0ea5e9">📝 Texte</button></div><button type="button" class="btn" data-action="journal-mode" style="background:#dc2626">📰 JOURNAL TV</button><p id="mt" style="font-size:12px;color:#aaa;margin-top:5px">Mode : Ma Photo</p></div>
<div class="c" id="pc"><div class="ph" id="photo-picker" role="button" tabindex="0" aria-label="Choisir une photo"><img id="pv" style="display:none"><span id="pt">Clique ici<br>Ta photo</span></div><input type="file" id="fi" accept="image/*" hidden></div>
<div class="c" id="tc" style="display:none"><p>Présentateur : <b id="an">👨🏾 Homme</b></p><div style="display:flex;gap:8px;font-size:30px;margin-top:6px"><span data-avatar="👨🏾" data-name="Homme" role="button" tabindex="0">👨🏾</span><span data-avatar="👩🏾" data-name="Femme" role="button" tabindex="0">👩🏾</span><span data-avatar="🧑🏾‍💼" data-name="Journaliste" role="button" tabindex="0">🧑🏾‍💼</span></div><div id="jo" style="display:none;margin-top:8px"><input id="ch" value="MOREL TV" placeholder="Nom chaîne"><input id="ci" placeholder="Ville ? Vide = pas de ville"></div></div>
<div class="c"><textarea id="tx">Salut, bienvenue à Cotonou ! Avec MOREL AI, ma photo parle.</textarea><div class="r"><select id="lg"><option value="fr-FR">🇫🇷 Français</option><option value="en-US">🇺🇸 Anglais</option></select><select id="vc"><option value="homme">👨 Homme</option><option value="femme">👩 Femme</option></select></div></div>
<button type="button" class="btn" data-action="generate" style="background:linear-gradient(135deg,#8b5cf6,#f97316)">▶️ GÉNÉRER LA VIDÉO</button><p id="st" style="text-align:center;color:#facc15;font-size:13px;margin-top:6px"></p>
<div class="c" id="rc" style="display:none"><video id="vo" controls playsinline></video><button type="button" class="btn" data-action="download" style="background:#22c55e">⬇️ TÉLÉCHARGER</button></div>
<div class="c" style="text-align:center"><button type="button" class="btn" data-action="premium" style="background:#facc15;color:#111">🔓 ILLIMITÉ - 2.000 F</button></div>
<div class="c" style="text-align:center;border:1px dashed #facc15"><b>🔑 Tu as un code ?</b><div style="display:flex;gap:6px;margin-top:6px"><input id="cc" placeholder="Code secret" style="margin:0"><button type="button" class="btn" data-action="unlock" style="width:100px;margin:0;background:#111;color:#facc15;border:1px solid #facc15;padding:10px">Débloquer</button></div><p id="cm" style="color:#facc15;font-size:12px"></p></div>
</div><script>
let iu=null,vb=null,rc=null,vs=[],mode=0,av='👨🏾',an='Homme',jr=false,left=2,prem=localStorage.getItem('morel_premium')==='1',cre=localStorage.getItem('morel_creator')==='1',used=parseInt(localStorage.getItem('morel_used')||'0'),lr=parseInt(localStorage.getItem('morel_last_reset')||'0');
if(Date.now()-lr>86400000){used=0;localStorage.setItem('morel_used','0');localStorage.setItem('morel_last_reset',Date.now().toString())}left=2-used;if(left<0)left=0;
function ck(){if(document.getElementById('cc').value.trim().toUpperCase()==='MOREL2026'){cre=true;prem=true;localStorage.setItem('morel_creator','1');localStorage.setItem('morel_premium','1');document.getElementById('cb').style.display='block';document.getElementById('ct').innerHTML='👑 MODE CRÉATEUR - ILLIMITÉ';document.getElementById('cm').innerText='✅ Bienvenue Patron !';alert('✅ Bienvenue Patron ! ILLIMITÉ pour toujours')}else document.getElementById('cm').innerText='❌ Code faux'}
if(cre){document.getElementById('cb').style.display='block';document.getElementById('ct').innerHTML='👑 MODE CRÉATEUR - ILLIMITÉ'}
speechSynthesis.onvoiceschanged=()=>vs=speechSynthesis.getVoices();vs=speechSynthesis.getVoices();
document.getElementById('fi').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=x=>{iu=x.target.result;let p=document.getElementById('pv');p.src=iu;p.style.display='block';document.getElementById('pt').style.display='none'};r.readAsDataURL(f)});
function sm(m){mode=m;jr=false;document.getElementById('jo').style.display='none';document.getElementById('pc').style.display=m?'none':'block';document.getElementById('tc').style.display=m?'block':'none';document.getElementById('mt').innerText=m?'Mode : Texte en Vidéo':'Mode : Ma Photo'}
function sj(){mode=1;jr=true;document.getElementById('pc').style.display='none';document.getElementById('tc').style.display='block';document.getElementById('jo').style.display='block';document.getElementById('mt').innerText='Mode : JOURNAL TV';av='🧑🏾‍💼';an='Journaliste';document.getElementById('an').innerText='🧑🏾‍💼 Journaliste';document.getElementById('tx').value="Bonsoir à tous, bienvenue dans le journal. Voici les principales nouvelles. Restez avec nous."}
function sa(e,n){av=e;an=n;document.getElementById('an').innerText=e+' '+n}
function mo(w){w=w.toLowerCase();if(/[aâ]/.test(w))return 36;if(/[oô]/.test(w))return 30;if(/[eéè]/.test(w))return 20;if(/[i]/.test(w))return 13;if(/[u]/.test(w))return 24;return 8}
async function gv(){if(!prem&&!cre&&left<=0){alert('2 vidéos utilisées. Débloque pour 2.000F');return}if(mode===0&&!iu){alert('Mets ta photo OU clique TEXTE / JOURNAL');return}let t=document.getElementById('tx').value.trim();if(!t)return;let ws=t.split(/\s+/),ch=document.getElementById('ch')?.value||'MOREL TV',ci=document.getElementById('ci')?.value||'',dt='● EN DIRECT';if(ci)dt+=' - '+ci.toUpperCase();let cv=document.createElement('canvas');cv.width=480;cv.height=480;let ctx=cv.getContext('2d'),m=0,hy=0,img=null;if(mode===0){img=new Image();img.src=iu;await new Promise(r=>img.onload=r)}
function dr(){if(jr){ctx.fillStyle='#0a0a15';ctx.fillRect(0,0,480,480);ctx.fillStyle='#dc2626';ctx.fillRect(0,0,480,64);ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText(ch.toUpperCase()+' • JOURNAL',240,42);ctx.fillStyle='#1e3a8a';ctx.fillRect(0,78,480,340)}else{ctx.fillStyle='#0a0a15';ctx.fillRect(0,0,480,480)}if(mode===0&&img){ctx.save();ctx.translate(0,hy);ctx.beginPath();ctx.arc(240,240,175,0,6.29);ctx.clip();ctx.drawImage(img,-5,-5,490,490);ctx.restore()}else{ctx.fillStyle='#1e1e32';ctx.beginPath();ctx.arc(240,230,130,0,6.29);ctx.fill();ctx.font='110px Arial';ctx.textAlign='center';ctx.fillText(av,240,275);ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText(an,240,390)}if(m>2){let y=mode===0?345:285;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(240,y,m,m*.6,0,0,6.29);ctx.fill();ctx.fillStyle='#7c1d1d';ctx.beginPath();ctx.ellipse(240,y+3,m*.7,m*.4,0,0,6.29);ctx.fill()}if(jr){ctx.fillStyle='#dc2626';ctx.fillRect(0,420,480,60);ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText(dt,240,456)}else{ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,430,480,50);ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('MOREL AI',240,462)}if(window.cw){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,390,480,32);ctx.fillStyle='#facc15';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText(window.cw,240,412)}}
dr();let st=cv.captureStream(30),ac=new (window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination(),ut=new SpeechSynthesisUtterance(t);ut.lang=document.getElementById('lg').value;ut.rate=.92;ut.pitch=document.getElementById('vc').value==='femme'?1.15:.85;let v=vs.find(x=>x.lang.startsWith(ut.lang.slice(0,2)))||vs[0];if(v)ut.voice=v;let comb=new MediaStream([...st.getVideoTracks(),...dest.stream.getAudioTracks()]);rc=new MediaRecorder(comb,{mimeType:'video/webm'});let ch2=[];rc.ondataavailable=e=>{if(e.data.size>0)ch2.push(e.data)};rc.onstop=()=>{vb=new Blob(ch2,{type:'video/webm'});let u=URL.createObjectURL(vb),vi=document.getElementById('vo');vi.src=u;vi.style.display='block';document.getElementById('rc').style.display='block';document.getElementById('st').innerText='✅ Vidéo prête !';if(!prem&&!cre){used++;left=2-used;localStorage.setItem('morel_used',used.toString());document.getElementById('lc').innerText=left}vi.play()};let wi=0;function nw(){if(wi>=ws.length){m=0;window.cw='';dr();return}let w=ws[wi];window.cw=w;let tg=mo(w),s=0;let a=setInterval(()=>{s++;if(s<6)m=tg*(s/6);else if(s<10)m=tg*.8;else{clearInterval(a);m=2}hy=Math.sin(wi)*2;dr()},40);wi++;setTimeout(nw,450)}ut.onstart=()=>{document.getElementById('st').innerText='🎙️ Vidéo en cours...';nw()};ut.onend=()=>{window.cw='';m=0;dr();setTimeout(()=>{try{rc.stop()}catch(e){}},400)};let os=ac.createOscillator();os.frequency.value=0;os.connect(dest);os.start();rc.start(200);speechSynthesis.cancel();speechSynthesis.speak(ut)}
function dv(){if(!vb)return;let a=document.createElement('a');a.href=URL.createObjectURL(vb);a.download='MOREL-AI-video.webm';a.click()}

/* Reliable button bindings: avoid inline click handlers. */
(function bindMorelControls(){
  const byId = id => document.getElementById(id);
  document.querySelector('[data-action="photo-mode"]').addEventListener('click',()=>sm(0));
  document.querySelector('[data-action="text-mode"]').addEventListener('click',()=>sm(1));
  document.querySelector('[data-action="journal-mode"]').addEventListener('click',sj);
  const picker=byId('photo-picker'), file=byId('fi');
  const openPicker=()=>file.click();
  picker.addEventListener('click',openPicker);
  picker.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker();}});
  document.querySelectorAll('[data-avatar]').forEach(el=>{
    const choose=()=>sa(el.dataset.avatar,el.dataset.name);
    el.addEventListener('click',choose);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});
  });
  document.querySelector('[data-action="generate"]').addEventListener('click',gv);
  document.querySelector('[data-action="download"]').addEventListener('click',dv);
  document.querySelector('[data-action="premium"]').addEventListener('click',()=>alert('Pour débloquer illimité : 2.000F - MTN MoMo / Moov Money - Contacte MOREL'));
  document.querySelector('[data-action="unlock"]').addEventListener('click',ck);
})();

</script></body></html>
